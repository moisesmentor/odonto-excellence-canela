<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 480" width="650" height="480" fill="none">
  <defs>
    <linearGradient id="facade-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="facade-wall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.15" />
    </linearGradient>
    <filter id="shadow-facade" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Fundo / Céu de Canela RS -->
  <rect width="650" height="480" rx="20" fill="url(#facade-sky)" />
  
  <!-- Vegetação elegante da Serra Gaúcha (hortênsias e pinheiros sutis) -->
  <circle cx="60" cy="380" r="45" fill="#4B7A58" opacity="0.3" />
  <circle cx="590" cy="380" r="50" fill="#4B7A58" opacity="0.3" />

  <!-- Edifício da Clínica Odonto Excellence Canela -->
  <g transform="translate(65, 50)" filter="url(#shadow-facade)">
    <!-- Estrutura Principal -->
    <rect x="0" y="40" width="520" height="340" rx="8" fill="url(#facade-wall)" stroke="#E5E7EB" stroke-width="2" />
    
    <!-- Faixa Arquitetônica Superior em Grafite #222222 -->
    <rect x="0" y="40" width="520" height="70" rx="8" fill="#222222" />
    <!-- Friso Vermelho #E30613 da marca -->
    <rect x="0" y="106" width="520" height="5" fill="#E30613" />

    <!-- Letreiro Oficial na Fachada -->
    <text x="260" y="78" font-family="'Montserrat', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.01em">
      ODONTO <tspan fill="#E30613">EXCELLENCE</tspan>
    </text>
    <text x="260" y="96" font-family="'Montserrat', sans-serif" font-size="9" font-weight="700" fill="#AAAAAA" text-anchor="middle" letter-spacing="0.25em">
      CLÍNICA ODONTOLÓGICA • CANELA RS
    </text>

    <!-- Fachada de Vidro Espelhado / Janelões Modernos -->
    <rect x="30" y="135" width="130" height="180" rx="4" fill="url(#glass)" stroke="#CBD5E1" stroke-width="2" />
    <line x1="95" y1="135" x2="95" y2="315" stroke="#CBD5E1" stroke-width="2" />
    <line x1="30" y1="225" x2="160" y2="225" stroke="#CBD5E1" stroke-width="2" />
    <!-- Reflexos no Vidro -->
    <line x1="45" y1="145" x2="120" y2="280" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.4" />

    <!-- Janela Superior Direita -->
    <rect x="360" y="135" width="130" height="180" rx="4" fill="url(#glass)" stroke="#CBD5E1" stroke-width="2" />
    <line x1="425" y1="135" x2="425" y2="315" stroke="#CBD5E1" stroke-width="2" />
    <line x1="360" y1="225" x2="490" y2="225" stroke="#CBD5E1" stroke-width="2" />
    <line x1="375" y1="145" x2="450" y2="280" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.4" />

    <!-- Porta Principal de Acesso (Vidro Duplo) -->
    <rect x="200" y="150" width="120" height="195" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" />
    <rect x="208" y="160" width="48" height="175" rx="2" fill="url(#glass)" stroke="#CBD5E1" />
    <rect x="264" y="160" width="48" height="175" rx="2" fill="url(#glass)" stroke="#CBD5E1" />
    <!-- Puxadores em aço inox -->
    <line x1="252" y1="230" x2="252" y2="270" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="268" y1="230" x2="268" y2="270" stroke="#475569" stroke-width="3" stroke-linecap="round" />

    <!-- Piso de Entrada com Acessibilidade -->
    <rect x="180" y="345" width="160" height="25" fill="#E2E8F0" />
    <rect x="160" y="370" width="200" height="10" rx="2" fill="#CBD5E1" />

    <!-- Placa de Atendimento Humanizado & Horário -->
    <rect x="175" y="200" width="18" height="25" rx="2" fill="#FFFFFF" stroke="#CCCCCC" />
    <circle cx="184" cy="208" r="4" fill="#E30613" />

    <!-- Iluminação de Fachada (Spots) -->
    <circle cx="100" cy="122" r="3" fill="#FBBF24" />
    <circle cx="260" cy="122" r="3" fill="#FBBF24" />
    <circle cx="420" cy="122" r="3" fill="#FBBF24" />
  </g>

  <!-- Calçada e paisagismo -->
  <rect x="0" y="420" width="650" height="60" fill="#E5E7EB" />
  <line x1="0" y1="420" x2="650" y2="420" stroke="#D1D5DB" stroke-width="2" />
</svg>
